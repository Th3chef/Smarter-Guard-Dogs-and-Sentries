# Uploads each published GitHub release to Nexus Mods as a new version of the mod's main file.
# Needs the repository secret NEXUSMODS (your Nexus Mods API key). Without it the run stops with a message
# and nothing is uploaded. Run it by hand from the Actions tab (Run workflow) to upload an existing release again.
name: Upload release to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (for example v4.5.1)
        required: true

permissions:
  contents: read

env:
  NEXUS_MOD_ID: '26280904900834'   # the mod's Unique Mod ID (Files tab, Advanced; not the 16610 in the page address)
  NEXUS_FILE_ID: '8035149'   # the main file's API File ID (Files tab, Advanced)
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  nexus:
    runs-on: ubuntu-latest
    steps:
      - name: Check the API key is set
        env:
          KEY: ${{ secrets.NEXUSMODS }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the NEXUSMODS repository secret (Settings, Secrets and variables, Actions) first."
            exit 1
          fi

      - name: Download the mod zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          FILE="Smarter-Guard-Dogs-and-Sentries-${VERSION}.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE"
          test -s "$FILE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Changelog from the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release notes up to the updating / download / install lines, one point per line
          # (Nexus shows each changelog line as its own bullet, so the "- " bullets and blank lines go)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            | tr -d '\r' | awk '/^(\*\*)?(Install|Updating|Download)/ {exit} {print}' \
            | sed -e 's/\*\*//g' -e 's/^[[:space:]]*[-*][[:space:]]\+//' | grep -v '^[[:space:]]*$' > notes.txt || true
          {
            echo 'text<<NOTES_END'
            cat notes.txt
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: File description from the changelog
        id: desc
        run: |
          # the changelog on one line, fitted to Nexus's 255-character file description:
          # long asides in brackets go first, then whole points from the end
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          MAX = 255
          head = os.environ['VERSION'] + ': '
          items = []
          for line in open('notes.txt', encoding='utf-8'):
              t = re.sub(r'^\s*(#+|[-*\u2022]|\d+[.)])\s*', '', line).strip()
              if not t or t.lower().startswith('smarter guard dogs'):
                  continue  # blank lines and the title line
              items.append(t if t[-1] in '.!?' else t + '.')
          def text(xs):
              return head + ' '.join(xs)
          if len(text(items)) > MAX:
              items = [re.sub(r'\s*\([^)]{20,}\)', '', i) for i in items]
          if len(text(items)) > MAX:
              more = ' More in the changelog.'
              while len(items) > 1 and len(text(items)) + len(more) > MAX:
                  items.pop()
              d = text(items)
              if len(d) + len(more) > MAX:
                  d = d[:MAX - len(more) - 3].rsplit(' ', 1)[0] + '...'
              d += more
          else:
              d = text(items)
          if not items:
              d = 'Version ' + os.environ['VERSION'] + '.'
          print('text=' + d)
          PY

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          filename: ${{ env.FILE }}
          version: ${{ env.VERSION }}
          # (Nexus allows only letters, digits, spaces and _ ' ( ) . - in the name: no &)
          display_name: Smarter Guard Dogs and Sentries ${{ env.VERSION }}
          description: ${{ steps.desc.outputs.text }}
          changelog: ${{ steps.notes.outputs.text }}
          archive_existing_version: true
          update_mod_version: true
